<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#F3F6F9;--ink:#17233B;--muted:#56637A;--card:#fff;--line:#D5DDE8;--cls:#26395F;--task:#2A8573;--bad:#C4332A;--acc:#2A8573;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1726;--ink:#E8EDF6;--muted:#9AA7BD;--card:#18233A;--line:#2B3A57;--cls:#3B5489;--task:#3FA58F;--bad:#F07167;--acc:#3FA58F;--onacc:#0F1726}}
:root[data-theme="dark"]{--bg:#0F1726;--ink:#E8EDF6;--muted:#9AA7BD;--card:#18233A;--line:#2B3A57;--cls:#3B5489;--task:#3FA58F;--bad:#F07167;--acc:#3FA58F;--onacc:#0F1726}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{display:flex;height:100%}
.side{width:230px;padding:20px 14px;display:flex;flex-direction:column;flex:none}
.logo{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:0 10px 22px}
.nv,.rc,.all{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font-weight:600}
.nv.on,.rc.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.rh{color:var(--muted);font-size:13px;padding:26px 10px 6px}
.rc{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.all{margin-top:auto;color:var(--muted)}
.panel{flex:1;margin:14px 14px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px}
.pill{border:1px solid var(--ink);background:none;border-radius:8px;padding:6px 14px;font-weight:600}
.ar{border:0;background:none;font-size:22px;padding:0 8px}
#ttl{font-size:19px;font-weight:600;margin-left:6px}
.sp{flex:1}.bar button{white-space:nowrap}
.pri{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
#vcal{display:flex;flex:1;min-height:0}
.calw{flex:1;display:flex;flex-direction:column;min-width:0}
.hd,.bd{display:grid;grid-template-columns:52px repeat(7,minmax(70px,1fr))}
.hd{border-bottom:2px solid var(--ink);padding-right:0}
.hd div{padding:6px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.hd b{display:block;font-size:18px;color:var(--ink)}
.hd .td b{background:var(--acc);color:var(--onacc);border-radius:50%;width:30px;height:30px;line-height:30px;margin:0 auto}
#grid{flex:1;overflow:auto;position:relative}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px}
.gut{position:relative}.gut span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:2px 6px;font-size:12px;line-height:15px;color:#fff;overflow:hidden;border:0;text-align:left;width:auto}
.blk.e{background:var(--cls)}.blk.t{background:var(--task);cursor:pointer}.blk.m{outline:2px solid var(--bad)}
.blk small{display:block;opacity:.85;font-size:11px}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2}
#drawer{width:340px;border-left:1px solid var(--line);display:none}
#vchat,#vall{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
#chatbox{display:flex;flex-direction:column;height:100%;min-height:0}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:600}
#msgs{flex:1;overflow:auto;padding:0 14px}
.m{max-width:88%;padding:8px 12px;border-radius:12px;margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.user{margin-left:auto;background:var(--acc);color:var(--onacc)}.m.assistant{background:var(--bg)}
.row{display:flex;gap:8px;padding:10px 14px}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.row input{flex:1}
details{padding:0 14px 12px;font-size:13px}summary{cursor:pointer;color:var(--muted)}
.q{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.q input{flex:1 1 90px}
.q button,.alt{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.empty{color:var(--muted);padding:14px}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.gut span:first-child{transform:none}
button[disabled]{opacity:.4;cursor:default}
.fbk{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--muted)}.fbk:hover{background:var(--card)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;resize:vertical}
.blk.sk{opacity:.4;text-decoration:line-through}
.hd small{display:block;font-size:11px;color:var(--acc);font-weight:600;min-height:14px}
.tc{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.th{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:center}.cr small{display:block}.sm2{padding:5px 10px;font-size:13px}
.mc .chips .chip{font-size:14px}
#hello{padding:16px 18px 0}.hi{font-size:24px;font-weight:800;letter-spacing:-.02em}.hs{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.lk{background:none;border:0;padding:0;color:var(--acc);font-weight:600;text-decoration:underline;font-size:14px}
.rr{display:flex;align-items:center;border-radius:8px}.rr:hover{background:var(--card)}.rr.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.rr .lt{flex:1;min-width:0}.rr .rc{width:100%;padding:8px 10px}.rr.on .rc{box-shadow:none;background:none}
.dots{background:none;border:0;padding:4px 8px;border-radius:6px;opacity:.55;font-size:18px;line-height:1}.dots:hover,.rr:hover .dots{opacity:1}
#menu{position:fixed;display:none;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;min-width:150px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px}#menu button:hover{background:var(--bg)}
#ctitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch{gap:6px}.ti{width:100%;padding:4px 8px}.lt{flex:1;min-width:0}.lt .rc{width:100%}.lb{display:flex;gap:6px;flex:none}.sm{display:block;color:var(--muted);font-size:12px}
.blk{touch-action:none;user-select:none;cursor:grab}.blk.d{opacity:.45;text-decoration:line-through}
#modal{position:fixed;inset:0;background:rgba(10,18,32,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90%;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.seg{display:flex;gap:6px;margin-bottom:6px}.seg button,.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px}
.seg button.on,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mc label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}.mc input{width:100%;padding:10px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.mc .pri{width:100%;margin-top:16px;padding:12px;font-size:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:10;display:none;max-width:90%}
.sug{display:flex;flex-wrap:wrap;gap:6px}.sug button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px}
@media (max-width:820px){.app{flex-direction:column}.side{width:auto;flex-direction:row;padding:10px;gap:6px;align-items:center;flex-wrap:wrap}.logo{padding:0 8px}.nv{width:auto}.rh,#rec,.all{display:none}.panel{margin:0 10px 10px}#vcal{flex-direction:column}#drawer{width:auto;border-left:0;border-top:1px solid var(--line);height:55%}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="logo">Nudge</div>
<button class="nv" id="nvc" onclick="go('cal')"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2.5" width="12" height="11.5" rx="2"/><path d="M2 6.5h12"/></svg>Calendar</button>
<button class="nv" id="nvk" onclick="go('cls')"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg>Classes</button>
<button class="nv" id="nvh" onclick="go('chat')"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 8a5.5 5 0 1 1 2.2 4L2 13.5l.8-3A5 5 0 0 1 2.5 8z"/></svg>Chats</button>
<div class="rh">Recents</div><div id="rec"></div>
<button class="all" onclick="go('all')">All chats &rsaquo;</button>
<button class="fbk" onclick="openFeedback()">Feedback</button>
</aside>
<main class="panel">
<div id="vcal">
<div class="calw">
<div id="hello"></div>
<div class="bar"><button class="pill" onclick="today()">Today</button><button class="ar" aria-label="Previous week" onclick="shift(-1)">&lsaquo;</button><button class="ar" aria-label="Next week" onclick="shift(1)">&rsaquo;</button><span id="ttl"></span><button class="alt" id="undob" onclick="undo()" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630; Undo</button><button class="alt" id="redob" onclick="redo()" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">Redo &#8631;</button><span class="sp"></span><button class="alt" onclick="openAdd()">+ Add</button><button class="pri" onclick="toggleDrawer()">Chat</button></div>
<div class="hd" id="hd"></div>
<div id="grid"><div class="bd" id="bd"></div></div>
</div>
<div id="drawer"></div>
</div>
<div id="vchat" hidden style="padding:0"></div>
<div id="vall" hidden></div>
<div id="vcls" hidden style="flex:1;overflow:auto;padding:18px 22px"><div class="mc" id="vc" style="max-width:600px;border:0;background:none;padding:0;max-height:none;overflow:visible"></div></div>
</main>
</div>

<div id="chatbox">
<div class="ch"><span id="ctitle">Ask Nudge</span><button class="alt" onclick="renameChat(S.cur)">Rename</button><button class="alt" id="pinb" onclick="pinChat(S.cur)">Pin</button><button class="alt" onclick="newChat()">New</button></div>
<div id="msgs"></div>
<div class="row"><input id="inp" placeholder="Message Nudge: add tasks, ask what's next, get help" aria-label="Message"><button class="pri" onclick="send()">Send</button></div>
<details><summary>More</summary><div class="q"><label>Import .ics <input id="ics" type="file" accept=".ics,text/calendar"></label><button onclick="sample()">Load sample week</button><button onclick="clearAll()">Clear all</button></div></details>
</div>

<form name="feedback" data-netlify="true" hidden><input name="category"><textarea name="message"></textarea><input name="email"></form>
<div id="modal"><div class="mc" id="mc"></div></div><div id="menu" role="menu"></div><div id="toast" role="status"></div>
<script>
var K="nudge_v2",M=60000,H0=0,H1=24,PX=44,S={events:[],tasks:[],set:{ds:8,de:21,buf:15,cap:240},chats:[],cur:null};
try{var raw=localStorage.getItem(K);if(raw)S=JSON.parse(raw)}catch(e){}
S.classes=S.classes||[];S.terms=S.terms||[];
var wk=0,view="cal",drawer=window.innerWidth>820,busy=false;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dayAt(i){var x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()+i);return x.getTime()}
function wkDay(i){var x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay()+wk*7+i);return x}
function tm(t){return new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function dstr(t){return new Date(t).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}

var UND=[],RED=[],lastSnap=null;
function snap(){return JSON.stringify({events:S.events,tasks:S.tasks,classes:S.classes,terms:S.terms,set:S.set})}
function applySnap(j){var o=JSON.parse(j);S.events=o.events;S.tasks=o.tasks;S.classes=o.classes;S.terms=o.terms;S.set=o.set;lastSnap=snap();save();render()}
function undo(){if(!UND.length){toast("Nothing to undo");return}RED.push(lastSnap);applySnap(UND.pop());toast("Undone")}
function redo(){if(!RED.length){toast("Nothing to redo");return}UND.push(lastSnap);applySnap(RED.pop());toast("Redone")}
document.addEventListener("keydown",function(e){
  if(!(e.ctrlKey||e.metaKey)||String(e.key).toLowerCase()!=="z")return;
  var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;
  e.preventDefault();if(e.shiftKey)redo();else undo()});
// Scheduler: tasks go only into free time, padded by the gap, inside the day window and daily cap.
function place(t,now){
  var buf=S.set.buf*M,mins=t.mins*M,busy=[];
  evs(dayAt(-1),dayAt(16)).forEach(function(e){busy.push([e.s-buf,e.e+buf])});
  S.tasks.forEach(function(x){if(x.id!==t.id&&!x.done&&x.slot)busy.push([x.slot.s-buf,x.slot.e+buf])});
  busy.sort(function(a,b){return a[0]-b[0]});
  for(var d=0;d<14;d++){
    var d0=dayAt(d),d1=dayAt(d+1),ws=d0+S.set.ds*36e5,we=d0+S.set.de*36e5;
    var cur=d===0?Math.max(ws,Math.ceil(now/(15*M))*15*M):ws,used=0;
    S.tasks.forEach(function(x){if(x.id!==t.id&&!x.done&&x.slot&&x.slot.s>=d0&&x.slot.s<d1)used+=x.mins});
    if(used+t.mins>S.set.cap)continue;
    for(var i=0;i<busy.length;i++){var b=busy[i];if(b[1]<=cur)continue;if(b[0]>=we)break;if(b[0]-cur>=mins)break;cur=Math.max(cur,b[1])}
    if(cur+mins<=we){t.slot={s:cur,e:cur+mins};return}
  }
  t.slot=null;
}
// "redo" re-places missed tasks, "all" re-packs future tasks; otherwise only new or conflicting tasks move.
function plan(mode){
  var pre=snap();if(lastSnap!==null&&pre!==lastSnap){UND.push(lastSnap);if(UND.length>40)UND.shift();RED=[]}
  var now=Date.now(),EV=evs(dayAt(-7),dayAt(60));
  S.tasks.forEach(function(t){
    if(t.done||!t.slot)return;
    var miss=mode==="redo"&&t.slot.e<now,fut=mode==="all"&&t.slot.s>=now;
    var hit=!t.pin&&EV.some(function(e){return e.s<t.slot.e&&e.e>t.slot.s});
    if(hit||miss||fut){t.slot=null;t.pin=false}});
  S.tasks.filter(function(t){return !t.done&&!t.slot}).sort(function(a,b){return (a.due||9e15)-(b.due||9e15)||b.mins-a.mins})
    .forEach(function(t){place(t,now)});
  lastSnap=snap();save();render();
}
function mkTask(title,mins,dueStr){var d=dueStr?new Date(dueStr+"T23:59").getTime():0;S.tasks.push({id:uid(),title:title,mins:Math.max(5,mins|0),due:isNaN(d)?0:d,done:false,slot:null});plan();return S.tasks[S.tasks.length-1]}
function mkEvent(title,date,s,e){var a=new Date(date+"T"+s).getTime(),b=new Date(date+"T"+e).getTime();if(!(b>a))return false;S.events.push({id:uid(),title:title||"Event",s:a,e:b});plan();return true}
function tog(id){S.tasks.forEach(function(t){if(t.id===id)t.done=!t.done});plan()}
function clearAll(){if(confirm("Delete all tasks, events and classes from this browser?")){S.events=[];S.tasks=[];S.classes=[];S.terms=[];plan()}}
function sample(){
  for(var i=0;i<7;i++){var d=dayAt(i-new Date().getDay()+1);if(i>4)break;
    S.events.push({id:uid(),title:"Bio lecture",s:d+9*36e5,e:d+10.5*36e5},{id:uid(),title:"Calculus",s:d+11*36e5,e:d+12.5*36e5})}
  var du=function(n){return dayAt(n)+86340000};
  S.tasks.push({id:uid(),title:"Problem set",mins:120,due:du(2),done:false,slot:null},{id:uid(),title:"Essay outline",mins:60,due:du(3),done:false,slot:null},{id:uid(),title:"Email professor",mins:30,due:0,done:false,slot:null});
  plan();
}
function pd(v){var m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/);if(!m)return 0;
  if(m[7])return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)).getTime()}
$("ics").addEventListener("change",function(ev){
  var f=ev.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var txt=String(r.result).replace(/\r?\n[ \t]/g,""),n=0,cut=Date.now()-864e5;
    txt.split("BEGIN:VEVENT").slice(1).forEach(function(b){
      var g=function(k){var m=b.match(new RegExp("\\n"+k+"[^:\\n]*:([^\\r\\n]*)"));return m?m[1].trim():""};
      var s=pd(g("DTSTART")),e=pd(g("DTEND"));
      if(s&&e>s&&e>cut&&n<500){S.events.push({id:uid(),title:g("SUMMARY")||"Event",s:s,e:e});n++}});
    plan();alert("Imported "+n+" upcoming events (recurring events appear once).")};
  r.readAsText(f);ev.target.value=""});

// ---------- classes and terms ----------
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],cd=[],cfT=null;
function term(id){return S.terms.filter(function(t){return t.id===id})[0]}
function tt(x){return new Date(2000,0,1,+x.slice(0,2),+x.slice(3)).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function dd(x,y){return new Date(x+"T00:00").toLocaleDateString([],y?{month:"short",day:"numeric",year:"numeric"}:{month:"short",day:"numeric"})}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function isBreak(t,k){return (t.breaks||[]).some(function(b){return k>=b.from&&k<=b.to})}
function schoolDay(t,d){var w=d.getDay();return w>0&&w<6&&!isBreak(t,ymd(d))}
// Rotating schedules (e.g. Green/Gold): the label advances on each school day, skipping weekends and breaks.
function rotLabel(t,d){
  if(!t.rot||!schoolDay(t,d))return null;
  var n=t.rot.labels.length,x=new Date(t.rot.anchor+"T00:00"),y=new Date(d.getFullYear(),d.getMonth(),d.getDate()),k=t.rot.idx,st=y>=x?1:-1;
  while(x.getTime()!==y.getTime()){x.setDate(x.getDate()+st);if(schoolDay(t,x))k+=st}
  return t.rot.labels[((k%n)+n)%n]}
function dayLab(d){var k=ymd(d);for(var i=0;i<S.terms.length;i++){var t=S.terms[i];if(t.rot&&k>=t.from&&k<=t.to){var l=rotLabel(t,d);if(l)return l}}return ""}
// All events in a range: one-off events plus every weekly class inside its term.
function evs(a,b,sk){
  var o=S.events.filter(function(e){return e.e>a&&e.s<b});
  S.classes.forEach(function(c){
    var t=term(c.termId);if(!t)return;
    var f=new Date(t.from+"T00:00").getTime(),z=new Date(t.to+"T23:59").getTime(),d=new Date(Math.max(a,f));d.setHours(0,0,0,0);
    for(;d.getTime()<=Math.min(b,z);d.setDate(d.getDate()+1)){
      if(isBreak(t,ymd(d)))continue;
      if(c.rot){if(rotLabel(t,d)!==c.rot)continue}else if(c.days.indexOf(d.getDay())<0)continue;

    else{
      var sm=typeof claude!=="undefined"?await claude.use("sample"):null;
      if(!sm)out.c="I can't chat from this view, but you can still use + Add to put things on your calendar.";
      else{var h=c.msgs.slice(0,-1).map(function(m){return{role:m.r,content:m.c}});h[0].content=SYS()+"\n\n"+h[0].content;
        var r=await sm(h,{cache:false,tools:TOOLS,onText:function(x){out.c=x.text||out.c;drawMsgs()}});out.c=r.text||"Done."}}
  }catch(e){out.c="Hmm, that didn't go through"+(CHAT_API&&e&&e.message?" ("+e.message+")":"")+". Try again, or use + Add to put things on the calendar."}
  busy=false;save();render()}
if(drawer&&!cur())newChat();plan();setInterval(function(){if(view==="cal"&&!drag)renderCal()},60000);
setTimeout(scrollNow,50);
</script>
